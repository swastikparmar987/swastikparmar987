<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" fill="none"><style>@font-face{font-family:'pb';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'t';src:url(data:font/woff2;base64,) format('woff2')}
.t{font-family:'t',sans-serif}.r{font-family:'r',sans-serif}.rb{font-family:'rb',sans-serif}.p{font-family:'p',monospace}.pb{font-family:'pb',monospace}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.08)}80%{transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
@keyframes flash{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes coin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(46px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.pop{animation:pop .7s cubic-bezier(.3,1.4,.5,1) both}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{animation:blink 4.5s infinite}
.tw{animation:twinkle 2.4s ease-in-out infinite}
.flash{animation:flash 1.1s step-end infinite}
.coin{animation:coin 1.6s ease-in-out infinite}
.wig{animation:wiggle 2.8s ease-in-out infinite}
.drift{animation:drift 7s ease-in-out infinite alternate}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
