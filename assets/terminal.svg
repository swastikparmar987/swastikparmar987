<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 388" width="100%">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0000"/><stop offset="1" stop-color="#000"/></linearGradient>
<style>
text{font-family:'Courier New',Consolas,monospace;font-size:21px}
.cmd{fill:#E10600;font-weight:bold}
.out{fill:#e8e8e8}
.line{animation:type 1.1s steps(46,end) both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cur{animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.scan{animation:sc 5s linear infinite}
@keyframes sc{from{transform:translateY(0)}to{transform:translateY(388px)}}
.glow{animation:gl 4s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.5}50%{opacity:1}}
</style></defs>
<rect x="2" y="2" width="1196" height="384" rx="14" fill="url(#bg)" stroke="#E10600" stroke-opacity=".55" stroke-width="2" class="glow"/>
<rect x="2" y="2" width="1196" height="42" rx="14" fill="#1a0000"/>
<rect x="2" y="30" width="1196" height="14" fill="#1a0000"/>
